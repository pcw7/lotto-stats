# 매주 로또 새 회차를 수집해서 웹페이지(docs/index.html)를 갱신한다.
#
# 동행복권은 해외(GitHub 서버) IP의 연속 요청을 막기 때문에 처음부터 다시 수집할 수 없다.
# 그래서 지난 데이터를 암호화해서(lotto.csv.enc) 레포에 보관하고, 복호화한 뒤 새 회차만 받는다. (요청 1~2번)
# 암호 키는 레포 Settings → Secrets의 LOTTO_DATA_KEY에 있다.
# 새 회차가 있어 페이지가 바뀌었을 때만 커밋·푸시하며, 푸시되면 GitHub Pages가 다시 배포된다.
# collect.py는 수집 전에 robots.txt를 확인해, 금지됐거나 내용이 바뀌었으면 데이터를 요청하지 않고 실패한다. (→ 실패 메일)
name: 로또 통계 갱신

on:
  schedule:
    # cron은 UTC 기준. 토요일 22:43(UTC) = 일요일 07:43(한국 시간). 토요일 저녁 추첨 결과를 반영
    # 예약 실행은 붐비는 시간에 늦어지거나 건너뛰어질 수 있어서, 예약이 가장 몰리는 UTC 자정 전후와 매시 정각을 피했다.
    - cron: "43 22 * * 6"
    # 예비: 일요일 10:43(UTC) = 일요일 19:43(한국 시간). 아침 실행이 늦어지거나 건너뛰어졌을 때를 대비해 한 번 더 확인한다.
    # 이미 반영됐으면 새 회차가 없어 커밋하지 않는다. 두 실행이 겹치면 아래 concurrency로 차례대로 실행된다.
    - cron: "43 10 * * 0"
  workflow_dispatch:      # Actions 탭에서 수동 실행

permissions:
  contents: write  # 갱신된 페이지를 커밋하고 푸시하기 위해 필요

concurrency:
  group: update-lotto

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOTTO_DATA_KEY: ${{ secrets.LOTTO_DATA_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 지난 데이터 복호화
        run: python data_crypt.py decrypt

      - name: 새 회차 수집
        run: python collect.py

      - name: 웹페이지 생성
        run: python build_site.py

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet -- docs; then
            echo "새 회차가 없어 커밋하지 않습니다."
            exit 0
          fi
          python data_crypt.py encrypt
          LAST=$(python -c "import pandas as pd; print(pd.read_csv('data/lotto.csv').draw_no.max())")
          # 작성자(author)는 레포 주인 계정(noreply 이메일)으로 해서 잔디에 반영되게 하고,
          # 커밋한 주체(committer)는 봇으로 남겨 자동 커밋임을 알 수 있게 한다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs lotto.csv.enc
          git commit --author="Parkchanwoo <58602643+pcw7@users.noreply.github.com>" -m "로또 통계 페이지 갱신 (${LAST}회 기준)"
          git pull --rebase
          git push
